<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall of Fame</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: white;
            color: #333;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .title {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 50px;
            color: #8B5A96;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(139, 90, 150, 0.3);
        }
        
        /* Carousel Styles */
        .carousel-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto 60px;
            background: linear-gradient(135deg, #9C7FB7, #B19BC7);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(139, 90, 150, 0.3);
        }
        
        .carousel-wrapper {
            overflow: hidden;
            border-radius: 15px;
        }
        
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        
        .carousel-slide {
            min-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
        }
        
        .carousel-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #8B5A96;
            box-shadow: 0 5px 15px rgba(139, 90, 150, 0.4);
            margin-bottom: 20px;
        }
        
        .carousel-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #8B5A96;
            margin-bottom: 10px;
        }
        
        .carousel-description {
            font-size: 1rem;
            color: #666;
            text-align: center;
            max-width: 400px;
        }
        
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            gap: 20px;
        }
        
        .carousel-btn {
            background: white;
            color: #8B5A96;
            border: 2px solid #8B5A96;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .carousel-btn:hover {
            background: #8B5A96;
            color: white;
            transform: scale(1.1);
        }
        
        .carousel-dots {
            display: flex;
            gap: 10px;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .dot.active {
            background: white;
            transform: scale(1.3);
        }
        
        /* Grid Layout */
        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        
        .person-card {
            background: linear-gradient(135deg, #F8F6FB, #EDE7F1);
            border: 2px solid #D1C4E0;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(139, 90, 150, 0.1);
        }
        
        .person-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(139, 90, 150, 0.2);
        }
        
        .person-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #8B5A96;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(139, 90, 150, 0.3);
        }
        
        .person-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #8B5A96;
            margin-bottom: 10px;
        }
        
        .person-role {
            font-size: 1rem;
            color: #7A6B85;
            font-style: italic;
        }
        
        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .carousel-container {
                margin: 0 10px 40px;
                padding: 20px;
            }
            
            .carousel-slide {
                padding: 20px;
            }
            
            .carousel-image {
                width: 120px;
                height: 120px;
            }
            
            .carousel-name {
                font-size: 1.4rem;
            }
            
            .people-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Hall of Fame</h1>
        
        <!-- Carousel Section -->
        <div class="carousel-container">
            <div class="carousel-wrapper">
                <div class="carousel-track" id="carouselTrack">
                    <div class="carousel-slide">
                        <img src="photos\farraz.png" alt="Farraz" class="carousel-image">
                        <div class="carousel-name">Farraz</div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="photos\kenzi.png" alt="Kenzi" class="carousel-image">
                        <div class="carousel-name">Kenzi</div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="photos\krisnaputra.png" alt="Krisnaputra" class="carousel-image">
                        <div class="carousel-name">Krisnaputra</div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="photos\maming.png" alt="Maming" class="carousel-image">
                        <div class="carousel-name">Maming</div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="photos\rifqi.png" alt="Rifqi" class="carousel-image">
                        <div class="carousel-name">Rifqi</div>
                    </div>
                    
                    <div class="carousel-slide">
                        <img src="photos\gavin.png" alt="Gavin" class="carousel-image">
                        <div class="carousel-name">Gavin</div>
                    </div>
                </div>
            </div>
            
            <div class="carousel-controls">
                <button class="carousel-btn" onclick="previousSlide()">&#8249;</button>
                <div class="carousel-dots" id="carouselDots"></div>
                <button class="carousel-btn" onclick="nextSlide()">&#8250;</button>
            </div>
        </div>
        
        <!-- Grid Layout -->
        <div class="people-grid">
            <div class="person-card">
                <img src="photos\farraz.png" alt="Farraz" class="person-image">
                <div class="person-name">Farraz</div>
                <div class="person-role">Auditor</div>
            </div>
            
            <div class="person-card">
                <img src="photos\kenzi.png" alt="Kenzi" class="person-image">
                <div class="person-name">Kenzi</div>
                <div class="person-role">Product QA</div>
            </div>
            
            <div class="person-card">
                <img src="photos\krisnaputra.png" alt="Krisnaputra" class="person-image">
                <div class="person-name">Krisnaputra</div>
                <div class="person-role">Programmer</div>
            </div>
            
            <div class="person-card">
                <img src="photos\maming.png" alt="Maming" class="person-image">
                <div class="person-name">Maming</div>
                <div class="person-role">Product QA</div>
            </div>
            
            <div class="person-card">
                <img src="photos\rifqi.png" alt="Rifqi" class="person-image">
                <div class="person-name">Rifqi</div>
                <div class="person-role">Programmer</div>
            </div>
            
            <div class="person-card">
                <img src="photos\gavin.png" alt="Gavin" class="person-image">
                <div class="person-name">Gavin</div>
                <div class="person-role">CM</div>
            </div>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-slide');
        const totalSlides = slides.length;
        
        // Create dots
        function createDots() {
            const dotsContainer = document.getElementById('carouselDots');
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                if (i === 0) dot.classList.add('active');
                dot.onclick = () => goToSlide(i);
                dotsContainer.appendChild(dot);
            }
        }
        
        // Update carousel position
        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            
            // Update dots
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentSlide);
            });
        }
        
        // Go to specific slide
        function goToSlide(slideIndex) {
            currentSlide = slideIndex;
            updateCarousel();
        }
        
        // Next slide
        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            updateCarousel();
        }
        
        // Previous slide
        function previousSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            updateCarousel();
        }
        
        // Initialize carousel
        function initCarousel() {
            createDots();
            updateCarousel();
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initCarousel);
    </script>
</body>
</html>
